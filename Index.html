<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh CSS di HTML</title>
    <style> 
        p { 
            text-align: center; 
            color: red; 
        } 
    </style>
</head>
<body>
    <h1 align="center">Contoh Menggunakan CSS di HTML</h1>
    <p>Ini adalah paragraf yang teksnya rata tengah dan berwarna merah.</p>
    <p>CSS diterapkan langsung di dalam tag &lt;style&gt; pada bagian &lt;head&gt;.</p>
</body>
</html>
